name: PR de Developed a main

on:
  push:
    branches:
      - Developed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-developed-to-main
  cancel-in-progress: false

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Crear o reutilizar el PR y activar auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: Developed
          TARGET_BRANCH: main
          REVIEWER: edwin-coder-arquitech
        run: |
          set -euo pipefail

          PR_URL=$(gh pr list \
            --head "$SOURCE_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SOURCE_BRANCH" \
              --title "Merge automático: Developed → main" \
              --body "Este PR se fusionará automáticamente cuando cumpla los requisitos de revisión y CI." \
              --reviewer "$REVIEWER")
          else
            gh pr edit "$PR_URL" --add-reviewer "$REVIEWER"
          fi

          gh pr merge "$PR_URL" --auto --merge