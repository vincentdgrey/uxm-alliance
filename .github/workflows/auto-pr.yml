name: Auto PR & Auto-Merge Develop to Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-enable-automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear PR y activar Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Crear el Pull Request (si ya existe uno abierto, no falla)
          PR_URL=$(gh pr create --base main --head develop --title "Merge automático: develop -> main" --body "Listo para aprobar desde el móvil. Se fusionará solo al aprobar." --reviewer "edwin-coder-arquitech" || gh pr view develop --json url -q .url)
          
          # 2. Activar el auto-merge en ese PR (usa --merge, --squash o --rebase según prefieras)
          gh pr merge "$PR_URL" --auto --merge
