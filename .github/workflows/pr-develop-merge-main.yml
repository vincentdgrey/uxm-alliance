name: PR Develop Merge Main

# Flujo develop -> main
#
# 1. create-or-update-pr (push a develop): crea/reutiliza el PR hacia main,
#    solicita revisión y activa el auto-merge nativo de GitHub.
# 2. merge-on-approval (revisión aprobada): respaldo del auto-merge. Si el PR
#    ya es mergeable lo fusiona; si no, explica en el log y en el resumen del
#    job POR QUÉ no se puede (checks fallidos, conflictos, rama atrasada o
#    configuración de protección/rulesets de main).
#
# IMPORTANTE: ningún workflow puede saltarse una protección de main.
# Si aparece "Cannot update this protected ref" hay que corregir la
# configuración del repositorio (Settings -> Rules / Branches), o ejecutar el
# merge con un token (AUTOMERGE_TOKEN) de una identidad autorizada/bypass.

on:
  push:
    branches: [develop]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

# Un grupo por tipo de evento: así un evento no reemplaza (cancela) a otro
# pendiente de distinto tipo, como ocurría con el grupo único anterior.
concurrency:
  group: pr-develop-to-main-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  create-or-update-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Crear o reutilizar el PR y activar auto-merge
        env:
          # Con AUTOMERGE_TOKEN (PAT/GitHub App) el PR sí dispara el CI
          # `pull_request`; con GITHUB_TOKEN no.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: develop
          TARGET_BRANCH: main
          REVIEWERS: edwin-coder-arquitech vincentdgrey
        run: |
          set -euo pipefail

          # --- 1) Crear o reutilizar el PR --------------------------------
          PR_NUMBER=$(gh pr list \
            --head "$SOURCE_BRANCH" --base "$TARGET_BRANCH" \
            --state open --json number --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            if ! OUT=$(gh pr create \
                --base "$TARGET_BRANCH" --head "$SOURCE_BRANCH" \
                --title "Merge automático: ${SOURCE_BRANCH} → ${TARGET_BRANCH}" \
                --body "Se fusionará a \`${TARGET_BRANCH}\` cuando sea aprobado y pasen los checks obligatorios." 2>&1); then
              echo "$OUT"
              if grep -qi "no commits between" <<<"$OUT"; then
                echo "::notice::${SOURCE_BRANCH} no tiene cambios respecto a ${TARGET_BRANCH}; no se crea PR."
                exit 0
              fi
              echo "::error title=No se pudo crear el PR::Revisa el log del paso (permisos del token o 'Allow GitHub Actions to create and approve pull requests')."
              exit 1
            fi
            PR_URL=$(tail -n1 <<<"$OUT")
            PR_NUMBER="${PR_URL##*/}"
            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "$OUT"
              echo "::error title=Respuesta inesperada de gh pr create::No se pudo obtener el número del PR."
              exit 1
            fi
            echo "PR creado: $PR_URL"
          else
            echo "PR existente: #$PR_NUMBER"
          fi

          # --- 2) Solicitar revisión (sin fallar si no es posible) --------
          AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
          DECISION=$(gh pr view "$PR_NUMBER" --json reviewDecision --jq '.reviewDecision')

          if [ "$DECISION" != "APPROVED" ]; then
            for reviewer in $REVIEWERS; do
              if [ "$reviewer" = "$AUTHOR" ]; then
                echo "Se omite a $reviewer: es el autor del PR."
                continue
              fi
              gh pr edit "$PR_NUMBER" --add-reviewer "$reviewer" \
                || echo "::warning::No se pudo solicitar revisión a $reviewer."
            done
          else
            echo "El PR ya está aprobado; no se solicitan revisiones nuevas."
          fi

          # --- 3) Activar auto-merge, clasificando el error ----------------
          if OUT=$(gh pr merge "$PR_NUMBER" --auto --merge 2>&1); then
            echo "$OUT"
            exit 0
          fi
          echo "$OUT"

          if grep -qiE "already (enabled|queued)" <<<"$OUT"; then
            echo "::notice::El auto-merge ya estaba activado."
          elif grep -qi "clean status" <<<"$OUT"; then
            echo "::notice::El PR ya cumple los requisitos; se fusiona directamente."
            gh pr merge "$PR_NUMBER" --merge
          elif grep -qiE "auto.?merge is not allowed" <<<"$OUT"; then
            echo "::error title=Auto-merge desactivado::Activa Settings -> General -> 'Allow auto-merge'."
            exit 1
          else
            echo "::error title=No se pudo activar el auto-merge::Revisa 'Allow auto-merge' y la protección de ${TARGET_BRANCH} (ver log)."
            exit 1
          fi

  merge-on-approval:
    # Solo reacciona a aprobaciones sobre el PR develop -> main. Ya no escucha
    # `check_suite` (poco fiable y generaba ejecuciones que se cancelaban entre
    # sí); si los checks aún corren, el auto-merge nativo fusiona al terminar.
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fusionar el PR develop → main si ya es mergeable
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELF_WORKFLOW: ${{ github.workflow }}
          SOURCE_BRANCH: develop
          TARGET_BRANCH: main
          REQUIRED_APPROVERS: edwin-coder-arquitech vincentdgrey
        run: |
          set -euo pipefail

          diagnose_blocked() {
            echo "::error title=Merge bloqueado por la configuración del repo::El PR está aprobado y los checks pasan, pero GitHub rechaza el merge. Revisa rulesets/branch protection de ${TARGET_BRANCH}."
            RULES=$(gh api "repos/${GH_REPO}/rules/branches/${TARGET_BRANCH}" \
              --jq '[.[].type] | unique | join(", ")' 2>/dev/null || echo "no disponible")
            [ -n "$RULES" ] || RULES="ninguna regla de ruleset"
            {
              echo "### Merge bloqueado en ${TARGET_BRANCH}"
              echo ""
              echo "- Respuesta de GitHub: \`${OUT}\`"
              echo "- Reglas de rulesets que aplican a ${TARGET_BRANCH}: \`${RULES}\`"
              case "$RULES" in
                *update*) echo "- **La regla \`update\` (Restrict updates) impide fusionar a quien no esté en la lista de bypass.** Quítala o añade bypass (modo 'pull requests only') a la identidad que hace el merge." ;;
              esac
              echo "- Revisa también Settings -> Branches (protección clásica): 'Restrict who can push', 'Require approval of the most recent push', CODEOWNERS."
              echo "- Alternativa: guardar un PAT de un admin con bypass como secret \`AUTOMERGE_TOKEN\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Reglas de rulesets que aplican a ${TARGET_BRANCH}: ${RULES}"
          }

          # --- 0) Estado actual (reintenta solo si GitHub aún calcula) -----
          for i in $(seq 1 6); do
            PR_JSON=$(gh pr view "$PR_NUMBER" --json state,mergeStateStatus,reviewDecision)
            PR_STATE=$(jq -r '.state' <<<"$PR_JSON")
            STATE=$(jq -r '.mergeStateStatus' <<<"$PR_JSON")
            DECISION=$(jq -r '.reviewDecision' <<<"$PR_JSON")
            if [ "$STATE" != "UNKNOWN" ]; then break; fi
            echo "mergeStateStatus=UNKNOWN; reintento $i/6..."
            sleep 5
          done
          echo "PR #$PR_NUMBER: state=$PR_STATE merge=$STATE review=$DECISION"

          if [ "$PR_STATE" != "OPEN" ]; then
            echo "::notice::El PR ya no está abierto ($PR_STATE); nada que hacer."
            exit 0
          fi

          # --- 1) Aprobación válida ----------------------------------------
          if [ "$DECISION" != "APPROVED" ]; then
            echo "::notice::Aún no cumple la regla de revisión ($DECISION); se espera."
            exit 0
          fi

          APPROVERS=$(gh pr view "$PR_NUMBER" --json reviews \
            --jq '.reviews[] | select(.state=="APPROVED") | .author.login' | sort -u)
          VALID=false
          for a in $APPROVERS; do
            case " $REQUIRED_APPROVERS " in *" $a "*) VALID=true ;; esac
          done
          if [ "$VALID" != "true" ]; then
            echo "::notice::La aprobación no viene de un revisor autorizado ($REQUIRED_APPROVERS)."
            exit 0
          fi

          # --- 2) Checks (sin contar las ejecuciones de ESTE workflow) -----
          # Antes el job se contaba a sí mismo como "pendiente" y esperaba
          # 5 minutos en vano; el filtro por workflowName lo evita.
          CHECKS=$(gh pr view "$PR_NUMBER" --json statusCheckRollup \
            | jq -c --arg self "$SELF_WORKFLOW" '
                [.statusCheckRollup[]?
                 | select((.workflowName // "") != $self)
                 | {name: (.name // .context // "?"),
                    status: (.status // ""),
                    conclusion: (.conclusion // .state // "")}]')

          PENDING_NAMES=$(jq -r '.[]
            | select((.status != "" and .status != "COMPLETED")
                     or (.status == "" and (.conclusion == "PENDING" or .conclusion == "EXPECTED")))
            | .name' <<<"$CHECKS")
          FAILED_NAMES=$(jq -r '.[]
            | select(.conclusion | IN("FAILURE","TIMED_OUT","CANCELLED","ACTION_REQUIRED","STARTUP_FAILURE","ERROR"))
            | .name' <<<"$CHECKS")

          if [ -n "$FAILED_NAMES" ]; then
            echo "$FAILED_NAMES" | sed 's/^/  fallido: /'
            echo "::error title=Checks fallidos::Hay checks en rojo/cancelados; el merge no se intenta."
            exit 1
          fi

          if [ -n "$PENDING_NAMES" ]; then
            echo "$PENDING_NAMES" | sed 's/^/  pendiente: /'
            echo "::notice::Hay checks en curso; se asegura el auto-merge y se termina (fusionará solo al pasar)."
            gh pr merge "$PR_NUMBER" --auto --merge \
              || echo "::warning::No se pudo (re)activar el auto-merge."
            exit 0
          fi

          # --- 3) Estados que no se resuelven intentando el merge ----------
          case "$STATE" in
            BEHIND)
              echo "::error title=develop está detrás de main::Actualiza develop con main manualmente (un push con GITHUB_TOKEN no dispara CI y puede invalidar la aprobación)."
              exit 1
              ;;
            DIRTY)
              echo "::error title=Conflictos::El PR tiene conflictos con ${TARGET_BRANCH}; resuélvelos en ${SOURCE_BRANCH}."
              exit 1
              ;;
            DRAFT)
              echo "::notice::El PR es borrador; se espera."
              exit 0
              ;;
            UNKNOWN)
              echo "::warning::GitHub no calculó la mergeabilidad; se reintentará con el próximo evento."
              exit 0
              ;;
          esac

          # --- 4) Merge explícito (CLEAN/UNSTABLE/HAS_HOOKS/BLOCKED) --------
          # BLOCKED sin checks pendientes ni fallidos se intenta igualmente
          # para obtener el motivo real que devuelve GitHub.
          if OUT=$(gh pr merge "$PR_NUMBER" --merge \
              --subject "Merge automático: ${SOURCE_BRANCH} → ${TARGET_BRANCH} (#${PR_NUMBER})" 2>&1); then
            echo "$OUT"
            echo "PR #$PR_NUMBER fusionado a $TARGET_BRANCH."
            exit 0
          fi

          echo "$OUT"
          if grep -qiE "protected (ref|branch)|cannot update|base branch policy|prohibits|not allowed|ruleset" <<<"$OUT"; then
            diagnose_blocked
          else
            echo "::error title=Falló el merge::Revisa el log del paso."
          fi
          exit 1
