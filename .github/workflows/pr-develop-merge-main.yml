name: PR Develop Merge Main

# Flujo de merge automático develop -> main.
#
# 1. `create-or-update-pr` (push a `develop`): crea/reutiliza el PR hacia
#    `main`, solicita revisión y activa la cola de auto-merge.
# 2. `merge-on-approval` (pull_request_review publicado + check_suite
#    completado): al cumplirse TODAS las condiciones de mergeabilidad
#    (aprobación + checks en verde), intenta el merge directamente como
#    plan B ante fallos de la cola nativa de auto-merge.
#
# CAUSA DEL BLOQUEO OBSERVADO ("Merging is blocked — Cannot update this
# protected ref"): la branch protection de `main` no autoriza a escribir a
# la identidad que ejecuta el merge. Los workflows de GitHub Actions usan el
# token `GITHUB_TOKEN`, cuya identidad es `github-actions[bot]`; si en
# "Restrict who can push to matching branches" no está incluido ese bot (o
# no se marcó "Allow auto-merge"), el merge queda bloqueado aunque el PR
# esté aprobado y los checks pasen. Solución: configurar la protección según
# docs/github-branch-protection.md (sección "Checklist de configuración").
on:
  push:
    branches:
      - develop
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: pr-develop-to-main
  cancel-in-progress: false

jobs:
  create-or-update-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # Necesario porque `gh pr create`/`gh pr merge` invocan git internamente
      # y requieren un repositorio git en el directorio de trabajo.
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Crear o reutilizar el PR y activar auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: develop
          TARGET_BRANCH: main
          # Revisores solicitados (basta la aprobación de uno de ellos,
          # siempre que cumpla las reglas de protección de `main`)
          REVIEWERS: edwin-coder-arquitech vincentdgrey

        run: |
          set -euo pipefail

          PR_URL=$(gh pr list \
            --head "$SOURCE_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [ -z "$PR_URL" ]; then
            PR_ARGS=(
              --base "$TARGET_BRANCH"
              --head "$SOURCE_BRANCH"
              --title "Merge automático: develop → main"
              --body "Este PR se fusionará automáticamente a \`main\` cuando sea aprobado por @edwin-coder-arquitech o @vincentdgrey y cumpla los requisitos de revisión y CI. Ver docs/github-branch-protection.md para la configuración de branch protection necesaria."
            )
            for reviewer in $REVIEWERS; do
              PR_ARGS+=(--reviewer "$reviewer")
            done
            PR_URL=$(gh pr create "${PR_ARGS[@]}")
          else
            # Volver a solicitar revisión en cada push (las revisiones
            # quedan obsoletas si la rama cambia tras el último commit).
            for reviewer in $REVIEWERS; do
              gh pr edit "$PR_URL" --add-reviewer "$reviewer" || true
            done
          fi

          echo "PR gestionado: $PR_URL"

          # Auto-merge: GitHub sólo fusionará cuando el PR tenga la
          # aprobación requerida y pasen las comprobaciones obligatorias.
          gh pr merge "$PR_URL" --auto --merge || {
            echo "No se pudo activar el auto-merge. Verificar:"
            echo "  1) Settings -> General -> Allow merge committing -> 'Allow auto-merge'"
            echo "  2) Branch protection de 'main' con 'Require a pull request before merging'"
            echo "     y revisiones obligatorias (1 aprobación)."
            echo "  3) En 'Restrict who can push to matching branches' incluir a"
            echo "     'github-actions[bot]' (identidad del GITHUB_TOKEN); sin esto"
            echo "     el merge falla con 'Cannot update this protected ref'."
            echo "Nota: el job 'merge-on-approval' intentará el merge igualmente"
            echo "al aprobarse el PR, como respaldo de la cola de auto-merge."
            exit 1
          }

  merge-on-approval:
    # Plan B: si la cola de auto-merge no ejecuta el merge (p. ej. porque la
    # protección de rama no autoriza al bot), este job fusiona el PR en cuanto
    # se cumplen todas las condiciones: aprobación + checks en verde.
    # Se dispara tanto al publicarse una revisión como al completarse un
    # check_suite, porque ambas condiciones pueden llegar en cualquier orden.
    if: >-
      github.event_name == 'pull_request_review' ||
      github.event_name == 'check_suite'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Fusionar el PR develop→main si ya es mergeable
        env:
          GH_TOKEN: ${{ github.token }}
          # Identidad del token: github-actions[bot]; debe estar autorizado
          # en la branch protection de main (ver docs/github-branch-protection.md).
          SOURCE_BRANCH: develop
          TARGET_BRANCH: main
          REQUIRED_APPROVERS: edwin-coder-arquitech vincentdgrey

        run: |
          set -euo pipefail

          PR_JSON=$(gh pr list \
            --head "$SOURCE_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json number,url,mergeable,mergeStateStatus,reviewDecision,statusCheckRollup)

          if [ "$PR_JSON" = "[]" ]; then
            echo "No hay PR abierto ${SOURCE_BRANCH} -> ${TARGET_BRANCH}; nada que hacer."
            exit 0
          fi

          NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
          URL=$(echo "$PR_JSON" | jq -r '.[0].url')
          MERGEABLE=$(echo "$PR_JSON" | jq -r '.[0].mergeable')
          STATE=$(echo "$PR_JSON" | jq -r '.[0].mergeStateStatus')
          DECISION=$(echo "$PR_JSON" | jq -r '.[0].reviewDecision')

          echo "PR #$NUMBER ($URL): mergeable=$MERGEABLE state=$STATE review=$DECISION"

          # 1) ¿Aprobación válida? La revisión debe ser APPROVED y provenir
          #    de alguno de los aprobadores autorizados (no vale el propio bot
          #    ni cuentas sin permiso de escritura).
          if [ "$DECISION" != "APPROVED" ]; then
            echo "Sin aprobación pendiente de regla de revisión ($DECISION); esperando."
            exit 0
          fi

          APPROVER_VALID=false
          for reviewer in $REQUIRED_APPROVERS; do
            if gh pr view "$NUMBER" --json reviews \
                 --jq "[.reviews[] | select(.state==\"APPROVED\") | .author.login] | index(\"$reviewer\")" \
                 | grep -q '^[0-9]'; then
              APPROVER_VALID=true
              break
            fi
          done
          if [ "$APPROVER_VALID" != "true" ]; then
            echo "La aprobación no proviene de un revisor autorizado (${REQUIRED_APPROVERS}); esperando."
            exit 0
          fi

          # 2) ¿Checks completados y en verde? (espera explícita por si el
          #    evento llegó antes de que terminara el check_suite).
          for i in $(seq 1 30); do
            CHECKS=$(gh pr view "$NUMBER" --json statusCheckRollup \
                     --jq '[.statusCheckRollup[] | {status: (.status // ""), conclusion: (.conclusion // "")}]')
            PENDING=$(echo "$CHECKS" | jq '[.[] | select(.status != "COMPLETED" and .conclusion == "")] | length')
            FAILED=$(echo "$CHECKS" | jq '[.[] | select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT" or .conclusion == "CANCELLED")] | length')
            if [ "$PENDING" -eq 0 ] && [ "$FAILED" -eq 0 ]; then
              break
            fi
            echo "Checks pendientes/fallantes (pendientes=$PENDING fallidos=$FAILED); reintento $i/30..."
            sleep 10
          done

          if [ "$PENDING" -ne 0 ] || [ "$FAILED" -ne 0 ]; then
            echo "Checks no listos tras el tiempo de espera (pendientes=$PENDING fallidos=$FAILED)."
            exit 1
          fi

          # STATE=$(gh pr view "$NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')

          # 3) Estado de mergeabilidad calculado por GitHub.
          case "$STATE" in
            BLOCKED)
              echo "El PR sigue BLOCKED. Revisar los requisitos de merge efectivos:"
              echo "- rulesets de repositorio u organización"
              echo "- reglas de protección que coincidan con main"
              echo "- aprobaciones y checks obligatorios"
              echo "- permisos del token que ejecuta el merge"
              exit 1
              ;;
            BEHIND)
              # develop quedó detrás de main: actualizarla desde main para
              # desbloquear el merge (push permitido en develop, no protegida).
              echo "develop está detrás de main; sincronizando..."
              git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" repo
              cd repo
              git fetch --quiet origin "$SOURCE_BRANCH" "$TARGET_BRANCH"
              git checkout --quiet -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  merge --no-edit "origin/$TARGET_BRANCH"
              git push --quiet origin "$SOURCE_BRANCH"
              echo "develop actualizada; el próximo evento reintentará el merge."
              exit 0
              ;;
            DIRTY|DRAFT|UNKNOWN)
              echo "PR no mergeable ahora (state=$STATE); esperando eventos siguientes."
              exit 0
              ;;
          esac

          # 4) Merge explícito (idempotente: si auto-merge ya lo fusionó, no hay PR abierto).
          gh pr merge "$NUMBER" --merge --subject "Merge automático: ${SOURCE_BRANCH} → ${TARGET_BRANCH} (#${NUMBER})"
          echo "PR #$NUMBER fusionado a $TARGET_BRANCH."
