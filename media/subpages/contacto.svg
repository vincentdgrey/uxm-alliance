<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" role="img" aria-label="Fondo de Contacto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1524"/>
      <stop offset="0.5" stop-color="#152742"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2b62a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0b1524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5a6c"/>
      <stop offset="1" stop-color="#1b2531"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0 L0 0 0 56" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#grid)"/>
  <rect width="1920" height="900" fill="url(#glow)"/>

  <!-- Ondas de radio -->
  <g transform="translate(960 380)" fill="none" stroke="#ff2400" opacity="0.35">
    <circle r="120" stroke-width="4"/>
    <circle r="210" stroke-width="3" opacity="0.8"/>
    <circle r="310" stroke-width="2.5" opacity="0.55"/>
    <circle r="420" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- Torre de radio / antena central -->
  <g transform="translate(960 380)">
    <path d="M-46 210 L-22 -150 L22 -150 L46 210 Z" fill="url(#metal)" stroke="#8fa4b8" stroke-width="4"/>
    <path d="M-30 210 L-14 -150 M30 210 L14 -150" stroke="#8fa4b8" stroke-opacity="0.5" stroke-width="3"/>
    <g stroke="#8fa4b8" stroke-width="3" stroke-opacity="0.6">
      <line x1="-26" y1="120" x2="26" y2="60"/>
      <line x1="-24" y1="60" x2="24" y2="0"/>
      <line x1="-22" y1="0" x2="22" y2="-60"/>
    </g>
    <circle cy="-170" r="18" fill="#ff2400"/>
    <circle cy="-170" r="34" fill="#ff2400" opacity="0.25"/>
    <!-- Base -->
    <rect x="-90" y="206" width="180" height="26" rx="8" fill="#1b2531" stroke="#8fa4b8" stroke-width="4"/>
  </g>

  <!-- Globo de dialogo izquierdo -->
  <g transform="translate(400 300)" opacity="0.95">
    <path d="M-150 -90 Q-150 -150 -80 -150 H60 Q130 -150 130 -90 V-10 Q130 50 60 50 H-20 L-80 100 L-62 50 H-80 Q-150 50 -150 -10 Z"
          fill="#101d30" stroke="#5f7f9e" stroke-width="5"/>
    <g stroke="#7fd3ff" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <line x1="-100" y1="-80" x2="40" y2="-80"/>
      <line x1="-100" y1="-40" x2="80" y2="-40"/>
      <line x1="-100" y1="0" x2="10" y2="0"/>
    </g>
  </g>

  <!-- Radio / ondas de contacto derecho -->
  <g transform="translate(1530 320)" opacity="0.95">
    <rect x="-90" y="-120" width="180" height="220" rx="20" fill="#101d30" stroke="#5f7f9e" stroke-width="5"/>
    <circle cy="-40" r="52" fill="#0a1421" stroke="#26b" stroke-width="5"/>
    <g stroke="#7fd3ff" stroke-width="6" stroke-linecap="round" opacity="0.8">
      <line x1="-40" y1="-40" x2="40" y2="-40"/>
      <line x1="-40" y1="-10" x2="40" y2="-10"/>
      <line x1="-40" y1="20" x2="20" y2="20"/>
    </g>
    <rect x="-60" y="40" width="120" height="34" rx="8" fill="#26b" opacity="0.85"/>
  </g>

  <!-- Nodo / enlace central inferior -->
  <g transform="translate(960 720)" opacity="0.85">
    <circle r="16" fill="#ff2400"/>
    <g stroke="#ff2400" stroke-width="4" fill="none" opacity="0.6">
      <path d="M-60 0 H-30 M30 0 H60"/>
      <circle cx="-90" r="12"/>
      <circle cx="90" r="12"/>
    </g>
  </g>

  <!-- Capa inferior -->
  <rect x="0" y="580" width="1920" height="320" fill="#03060b" opacity="0.5"/>
  <ellipse cx="960" cy="700" rx="640" ry="120" fill="#03060b" opacity="0.55" filter="url(#soft)"/>
</svg>
