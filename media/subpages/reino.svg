<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" role="img" aria-label="Fondo de Reino">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a26"/>
      <stop offset="0.5" stop-color="#14324a"/>
      <stop offset="1" stop-color="#040b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2f6f9c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0b1a26" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#grid)"/>
  <rect width="1920" height="900" fill="url(#glow)"/>

  <!-- Mapa del reino: muralla y capital -->
  <g transform="translate(960 400)">
    <circle r="250" fill="#08161f" stroke="#4e7f9c" stroke-width="5" opacity="0.95"/>
    <circle r="212" fill="none" stroke="#3f7a94" stroke-opacity="0.55" stroke-width="3"/>
    <circle r="150" fill="none" stroke="#3f7a94" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Muralla exterior con almenas -->
    <g fill="#102634" stroke="#6c9cbc" stroke-width="4">
      <path d="M-250 -40 L-250 -70 L-210 -70 L-210 -40 L-170 -40 L-170 -70 L-130 -70 L-130 -40
               L-90 -40 L-90 -70 L-50 -70 L-50 -40 L-10 -40 L-10 -70 L30 -70 L30 -40
               L70 -40 L70 -70 L110 -70 L110 -40 L150 -40 L150 -70 L190 -70 L190 -40 L230 -40 L230 -70 L250 -70
               L250 40 L230 40 L230 70 L190 70 L190 40 L150 40 L150 70 L110 70 L110 40
               L70 40 L70 70 L30 70 L30 40 L-10 40 L-10 70 L-50 70 L-50 40
               L-90 40 L-90 70 L-130 70 L-130 40 L-170 40 L-170 70 L-210 70 L-210 40 L-250 40 Z"/>
    </g>

    <!-- Carreteras entre territories -->
    <g stroke="#26b" stroke-width="8" stroke-opacity="0.4" fill="none">
      <path d="M0 0 L-160 -120"/>
      <path d="M0 0 L170 -100"/>
      <path d="M0 0 L-150 130"/>
      <path d="M0 0 L160 120"/>
    </g>

    <!-- Territorios marcados -->
    <g>
      <path d="M-160 -120 L-180 -68 L-140 -68 Z" fill="#26b"/>
      <circle cx="-160" cy="-100" r="10" fill="#26b"/>
      <path d="M170 -100 L150 -48 L190 -48 Z" fill="#26b"/>
      <circle cx="170" cy="-80" r="10" fill="#26b"/>
      <path d="M-150 130 L-170 78 L-130 78 Z" fill="#26b"/>
      <circle cx="-150" cy="110" r="10" fill="#26b"/>
      <path d="M160 120 L140 68 L180 68 Z" fill="#26b"/>
      <circle cx="160" cy="100" r="10" fill="#26b"/>
    </g>

    <!-- Capital del reino -->
    <path d="M0 0 L-26 62 L26 62 Z" fill="#ff2400"/>
    <circle cy="22" r="9" fill="#08161f"/>
    <circle r="58" fill="none" stroke="#ff2400" stroke-width="3" opacity="0.6"/>
    <circle r="86" fill="none" stroke="#ff2400" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Torres laterales -->
  <g transform="translate(300 430)" opacity="0.9">
    <path d="M-46 150 L46 150 L38 74 L14 74 L14 44 L30 44 L30 -18 L-30 -18 L-30 44 L-14 44 L-14 74 L-38 74 Z"
          fill="#12293a" stroke="#6c9cbc" stroke-width="5"/>
    <ellipse cx="0" cy="160" rx="72" ry="20" fill="#0a1a26" stroke="#6c9cbc" stroke-width="5"/>
  </g>
  <g transform="translate(1620 430)" opacity="0.9">
    <path d="M-42 150 L42 150 L34 70 L12 70 L12 40 L26 40 L26 -14 L-26 -14 L-26 40 L-12 40 L-12 70 L-34 70 Z"
          fill="#12293a" stroke="#6c9cbc" stroke-width="5"/>
    <ellipse cx="0" cy="160" rx="68" ry="20" fill="#0a1a26" stroke="#6c9cbc" stroke-width="5"/>
  </g>

  <!-- Capa inferior -->
  <rect x="0" y="580" width="1920" height="320" fill="#030709" opacity="0.5"/>
  <ellipse cx="960" cy="700" rx="640" ry="120" fill="#030709" opacity="0.55" filter="url(#soft)"/>
</svg>
