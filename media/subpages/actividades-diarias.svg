<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" role="img" aria-label="Fondo de Actividades Diarias">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="0.5" stop-color="#1b2f4a"/>
      <stop offset="1" stop-color="#070d16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#2c5f8f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#101a2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33475f"/>
      <stop offset="1" stop-color="#16222f"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 L0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#grid)"/>
  <rect width="1920" height="900" fill="url(#glow)"/>

  <!-- Calendario gigante -->
  <g transform="translate(960 400)">
    <rect x="-330" y="-250" width="660" height="500" rx="18" fill="url(#panel)" stroke="#7f95ad" stroke-width="5" opacity="0.95"/>
    <rect x="-330" y="-250" width="660" height="86" rx="18" fill="#ff2400" opacity="0.85"/>
    <rect x="-330" y="-190" width="660" height="26" fill="#ff2400" opacity="0.85"/>
    <g fill="#e8eef5" opacity="0.75">
      <circle cx="-250" cy="-300" r="12"/>
      <circle cx="250" cy="-300" r="12"/>
    </g>
    <!-- Cuadricula -->
    <g stroke="#9db3c9" stroke-opacity="0.35" stroke-width="3">
      <line x1="-330" y1="-104" x2="330" y2="-104"/>
      <line x1="-330" y1="-4" x2="330" y2="-4"/>
      <line x1="-330" y1="96" x2="330" y2="96"/>
      <line x1="-330" y1="196" x2="330" y2="196"/>
      <line x1="-165" y1="-164" x2="-165" y2="250"/>
      <line x1="0" y1="-164" x2="0" y2="250"/>
      <line x1="165" y1="-164" x2="165" y2="250"/>
    </g>
    <!-- Celdas marcadas -->
    <g fill="#df1b1b">
      <rect x="-148" y="-86" width="56" height="56" rx="8" opacity="0.9"/>
      <rect x="17" y="-86" width="56" height="56" rx="8" opacity="0.55"/>
    </g>
    <g fill="#26b">
      <rect x="-148" y="14" width="56" height="56" rx="8" opacity="0.7"/>
      <rect x="182" y="114" width="56" height="56" rx="8" opacity="0.45"/>
    </g>
    <g fill="#c9d8e6" opacity="0.5">
      <rect x="-313" y="14" width="56" height="56" rx="8"/>
      <rect x="17" y="114" width="56" height="56" rx="8"/>
    </g>
  </g>

  <!-- Reloj lateral -->
  <g transform="translate(300 470)" opacity="0.9">
    <circle r="130" fill="#0d1926" stroke="#7f95ad" stroke-width="6"/>
    <circle r="104" fill="none" stroke="#26b" stroke-width="3" opacity="0.5"/>
    <g stroke="#dbe6f0" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-92" x2="0" y2="-72"/>
      <line x1="0" y1="92" x2="0" y2="72"/>
      <line x1="-92" y1="0" x2="-72" y2="0"/>
      <line x1="92" y1="0" x2="72" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="-58" stroke="#ff2400" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="42" y2="24" stroke="#dbe6f0" stroke-width="7" stroke-linecap="round"/>
    <circle r="9" fill="#ff2400"/>
  </g>

  <!-- Checklist lateral -->
  <g transform="translate(1630 470)" opacity="0.9">
    <rect x="-120" y="-160" width="240" height="320" rx="14" fill="#0e1a26" stroke="#7f95ad" stroke-width="5"/>
    <g fill="none" stroke="#26b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="-92,-108 -68,-84 -30,-134"/>
      <polyline points="-92,-28 -68,-4 -30,-54"/>
    </g>
    <g stroke="#c9d8e6" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round">
      <line x1="-8" y1="-120" x2="88" y2="-120"/>
      <line x1="-8" y1="-40" x2="88" y2="-40"/>
      <line x1="-8" y1="40" x2="88" y2="40"/>
      <line x1="-8" y1="120" x2="60" y2="120"/>
    </g>
    <g stroke="#ff2400" stroke-width="8" stroke-linecap="round" opacity="0.85">
      <line x1="-92" y1="36" x2="-78" y2="50"/>
      <line x1="-78" y1="50" x2="-52" y2="24"/>
    </g>
  </g>

  <!-- Capa inferior -->
  <rect x="0" y="580" width="1920" height="320" fill="#03070c" opacity="0.5"/>
  <ellipse cx="960" cy="710" rx="640" ry="120" fill="#03070c" opacity="0.55" filter="url(#soft)"/>
</svg>
