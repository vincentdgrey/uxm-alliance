<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" role="img" aria-label="Fondo de Estrategia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a16"/>
      <stop offset="0.5" stop-color="#153029"/>
      <stop offset="1" stop-color="#050b09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#2f7a5c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0d1a16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#grid)"/>
  <rect width="1920" height="900" fill="url(#glow)"/>

  <!-- Mapa tactico -->
  <g transform="translate(960 400)">
    <rect x="-470" y="-300" width="940" height="520" rx="18" fill="#08130f" stroke="#4e7f68" stroke-width="5" opacity="0.95"/>
    <!-- Curvas de nivel -->
    <g fill="none" stroke="#3f7a62" stroke-opacity="0.55" stroke-width="3">
      <path d="M-430 -170 Q-200 -250 30 -180 T430 -120"/>
      <path d="M-430 -60 Q-180 -140 60 -60 T430 10"/>
      <path d="M-430 60 Q-220 -10 20 70 T430 140"/>
      <path d="M-430 180 Q-160 100 80 190 T430 250"/>
    </g>
    <!-- Rio /Thinking -->
    <path d="M-470 40 Q-250 120 -60 60 T470 120" fill="none" stroke="#26b" stroke-width="10" stroke-opacity="0.45"/>
    <!-- Rutas -->
    <g stroke="#ff2400" stroke-width="5" stroke-opacity="0.75" stroke-dasharray="18 14" fill="none">
      <path d="M-420 220 Q-180 40 0 0 T430 -220"/>
      <path d="M-420 -220 Q-160 -60 20 -120 T430 40"/>
    </g>
    <!-- Marcadores -->
    <g>
      <path d="M0 0 L-26 62 L26 62 Z" fill="#ff2400"/>
      <circle cy="22" r="9" fill="#0b1a14"/>
      <path d="M-300 -180 L-320 -134 L-274 -134 Z" fill="#26b"/>
      <path d="M300 180 L280 134 L326 134 Z" fill="#26b"/>
      <circle cx="-300" cy="-120" r="10" fill="#26b"/>
      <circle cx="300" cy="160" r="10" fill="#26b"/>
    </g>
    <!-- Marcador principal con halo -->
    <circle r="58" fill="none" stroke="#ff2400" stroke-width="3" opacity="0.6"/>
    <circle r="86" fill="none" stroke="#ff2400" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Piezas de ajedrez / estrategia a los lados -->
  <g transform="translate(320 420)" opacity="0.92">
    <path d="M-58 150 L58 150 L44 96 L12 96 L12 54 L40 54 L52 6 L-52 6 L-40 54 L-12 54 L-12 96 L-44 96 Z"
          fill="#1d332b" stroke="#6c9c84" stroke-width="5"/>
    <ellipse cx="0" cy="160" rx="86" ry="22" fill="#12241d" stroke="#6c9c84" stroke-width="5"/>
  </g>
  <g transform="translate(1600 420)" opacity="0.92">
    <path d="M-52 150 L52 150 L38 100 L0 100 L0 62 L26 62 L34 6 L-34 6 L-26 62 L0 62 L0 100 L-38 100 Z"
          fill="#1d332b" stroke="#6c9c84" stroke-width="5"/>
    <ellipse cx="0" cy="160" rx="80" ry="22" fill="#12241d" stroke="#6c9c84" stroke-width="5"/>
  </g>

  <!-- Capa inferior -->
  <rect x="0" y="580" width="1920" height="320" fill="#030706" opacity="0.5"/>
  <ellipse cx="960" cy="700" rx="640" ry="120" fill="#030706" opacity="0.55" filter="url(#soft)"/>
</svg>
