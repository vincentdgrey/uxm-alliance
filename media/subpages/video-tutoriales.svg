<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" role="img" aria-label="Fondo de Video Tutoriales">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14100a"/>
      <stop offset="0.5" stop-color="#2a1c0d"/>
      <stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6b3a12" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14100a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26313d"/>
      <stop offset="1" stop-color="#101720"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#ffffff" opacity="0.03"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#glow)"/>

  <!-- Marco de proyeccion / pantallas apiladas -->
  <g transform="translate(960 400)">
    <rect x="-430" y="-300" width="860" height="480" rx="20" fill="#0d0b08" stroke="#5d4a33" stroke-width="5" opacity="0.9"/>
    <rect x="-380" y="-252" width="760" height="384" rx="10" fill="url(#screen)"/>
    <rect x="-380" y="-252" width="760" height="384" rx="10" fill="url(#scan)"/>

    <!-- Reproductor dentro de la pantalla -->
    <circle cx="0" cy="-40" r="104" fill="#1b2632" stroke="#ff2400" stroke-width="6" opacity="0.95"/>
    <path d="M-34 -78 L72 -40 L-34 -2 Z" fill="#ff2400" opacity="0.95"/>

    <!-- Barra de progreso -->
    <rect x="-320" y="96" width="640" height="10" rx="5" fill="#4b5b6b" opacity="0.7"/>
    <rect x="-320" y="96" width="330" height="10" rx="5" fill="#ff2400" opacity="0.95"/>
    <circle cx="10" cy="101" r="14" fill="#ff2400"/>

    <!-- Controles -->
    <g fill="#d6dee6" opacity="0.55">
      <rect x="-320" y="52" width="26" height="16" rx="4"/>
      <rect x="-278" y="46" width="26" height="28" rx="4"/>
      <rect x="-236" y="52" width="26" height="16" rx="4"/>
    </g>
  </g>

  <!-- Camaras / focos laterales -->
  <g transform="translate(330 400)" opacity="0.9">
    <rect x="-140" y="-110" width="280" height="150" rx="16" fill="#171208" stroke="#5d4a33" stroke-width="5"/>
    <circle r="52" fill="#0d0b08" stroke="#ff2400" stroke-width="5"/>
    <circle r="26" fill="#22303c"/>
    <circle r="12" fill="#ff2400" opacity="0.85"/>
    <path d="M140 -50 L210 -18 L210 18 L140 50 Z" fill="#2a1c0d" stroke="#5d4a33" stroke-width="4"/>
    <!-- Haz de luz -->
    <path d="M210 -18 L640 130 L640 200 L210 18 Z" fill="#ff2400" opacity="0.08"/>
  </g>

  <g transform="translate(1590 400)" opacity="0.9">
    <rect x="-140" y="-110" width="280" height="150" rx="16" fill="#171208" stroke="#5d4a33" stroke-width="5"/>
    <circle r="52" fill="#0d0b08" stroke="#ff2400" stroke-width="5"/>
    <circle r="26" fill="#22303c"/>
    <circle r="12" fill="#ff2400" opacity="0.85"/>
    <path d="M-140 -50 L-210 -18 L-210 18 L-140 50 Z" fill="#2a1c0d" stroke="#5d4a33" stroke-width="4"/>
    <path d="M-210 -18 L-640 130 L-640 200 L-210 18 Z" fill="#ff2400" opacity="0.08"/>
  </g>

  <!-- Botones de tema (referencia a los anchors de la subpagina) -->
  <g transform="translate(960 730)" opacity="0.75">
    <rect x="-360" y="-34" width="220" height="68" rx="34" fill="none" stroke="#26b" stroke-width="5"/>
    <rect x="-70" y="-34" width="140" height="68" rx="34" fill="none" stroke="#26b" stroke-width="5"/>
    <rect x="140" y="-34" width="220" height="68" rx="34" fill="none" stroke="#26b" stroke-width="5"/>
  </g>

  <!-- Capa inferior -->
  <rect x="0" y="580" width="1920" height="320" fill="#060402" opacity="0.5"/>
  <ellipse cx="960" cy="700" rx="660" ry="120" fill="#060402" opacity="0.55" filter="url(#soft)"/>
</svg>
