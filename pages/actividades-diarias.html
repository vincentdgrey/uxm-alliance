<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actividades Diarias – UXM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/activities-daily.css">
</head>
<body>
  <nav class="navbar topbar" aria-label="Main navigation">
    <div class="container-fluid">
      <button id="navToggle" class="btn-icon navbar-toggler nav-toggle" type="button"
              aria-controls="navPanel" aria-expanded="false" aria-label="Menu">
        <span class="nav-toggle-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <a id="homeLink" class="navbar-brand topbar-brand" href="../index.html">UXM</a>
    </div>
    <div id="navPanel" class="nav-panel" role="dialog" aria-modal="true"
         aria-labelledby="navPanelTitle" hidden>
      <h2 id="navPanelTitle" class="visually-hidden">Site sections</h2>
      <ul id="navList" class="nav-list navbar-nav"></ul>
      <div id="sideLangs" class="langs side-langs"></div>
    </div>
    <div id="navBackdrop" class="nav-backdrop" hidden></div>
  </nav>

  <main id="stage">
    <section class="subpage-content subpage-daily" id="content">
      <div class="subpage">
        <p class="tag">[UXM] · Kingdom 277</p>
        <h1 id="heroTitle" class="subpage-title">
          <span class="subpage-title-word">
            <span class="subpage-title-initial subpage-title-accent">A</span><span>ctividades Diarias</span>
          </span>
        </h1>
        <p id="pageLead" class="welcome"></p>
      </div>
    </section>

    <section class="subpage-banner">
      <h3 class="sibtitle-info banner-subpage" id="textBS" data-i18n="scheduleBattleSurvival">Cronograma Batalla Supervivencia</h3>
    </section>

    <section class="block-content-info">
      <div class="battle-content">
        <div class="bs-wrap">
          <table class="bs-schedule">
            <thead>
              <tr>
                <th id="bs-th-counter"></th>
                <th id="bs-th-status"></th>
                <th id="bs-th-event"></th>
                <th id="bs-th-activities"></th>
                <th id="bs-th-server"></th>
              </tr>
            </thead>
            <tbody id="bs-body"></tbody>
          </table>
        </div>
        <div id="bs-tzinfo"></div>
      </div>

    </section>

    <section class="subpage-banner">
      <h3 class="sibtitle-info banner-subpage" id="textAD" data-i18n="scheduleAllianceDuel">Duelo de Alianzas</h3>
    </section>

    <section class="block-content-info">
      <div class="duel-alliance-content">
        <div id="ad-lists"></div>
        <div id="ad-tzinfo"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <a id="ytLink" class="yt-link" href="https://www.youtube.com/@VincentDantesGrey/videos"
       target="_blank" rel="noopener noreferrer">
      <svg class="yt-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="#ff1919" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8z"/>
        <path fill="#fff" d="M9.6 15.6 15.8 12 9.6 8.4z"/>
      </svg>
      <span id="ytLabel">YouTube</span>
    </a>
    <p id="copyright" class="copyright"></p>
    <div id="langs" class="langs"></div>
  </footer>

  <noscript>UXM – Under Xtreme Madness · Kingdom 277</noscript>
  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/activities-daily.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
