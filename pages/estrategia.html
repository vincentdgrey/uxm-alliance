<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estrategia – UXM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/estrategia.css">
</head>
<body>
  <nav class="navbar topbar" aria-label="Main navigation">
    <div class="container-fluid">
      <button id="navToggle" class="btn-icon navbar-toggler nav-toggle" type="button"
              aria-controls="navPanel" aria-expanded="false" aria-label="Menu">
        <span class="nav-toggle-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <a id="homeLink" class="navbar-brand topbar-brand" href="../index.html">UXM</a>
    </div>
    <div id="navPanel" class="nav-panel" role="dialog" aria-modal="true"
         aria-labelledby="navPanelTitle" hidden>
      <h2 id="navPanelTitle" class="visually-hidden">Site sections</h2>
      <ul id="navList" class="nav-list navbar-nav"></ul>
      <div id="sideLangs" class="langs side-langs"></div>
    </div>
    <div id="navBackdrop" class="nav-backdrop" hidden></div>
  </nav>

  <main id="stage">
    
    <section class="subpage-content subpage-strategy" id="content">
      <div class="subpage">
        <p class="tag">[UXM] · Kingdom 277</p>
        <h1 id="heroTitle" class="subpage-title">
          <span class="subpage-title-word">
            <span class="subpage-title-initial subpage-title-accent">B</span><span>iblioteca Estratégica</span>
          </span>
        </h1>
        <p id="pageLead" class="welcome"></p>
      </div>
    </section>

    <section class="block-content-info">
      <h3 class="subtitle-info" id="searchEngine" data-i18n="searchEngineTitle">Buscador</h3>

      <div class="search-engine-elements row g-4">

        <div class="col-6 col-lg-6 search-engine-panel">
          <form class="search-engine-form" id="searchEngineForm" role="search" autocomplete="off">
            <label class="form-label" for="searchEngineInput" data-i18n-text="searchEngineSearchLabel">Buscar en la biblioteca</label>
            <div class="input-group">
              <input type="search" class="form-control" id="searchEngineInput"
                     placeholder="Escribe una palabra o frase"
                     aria-describedby="searchEngineStatus">
              <button class="btn btn-outline-secondary" type="button" id="searchEngineClear"
                      data-i18n-title="searchEngineClear" title="Limpiar búsqueda">
                <span aria-hidden="true">✕</span>
                <span class="visually-hidden" data-i18n-text="searchEngineClear">Limpiar búsqueda</span>
              </button>
            </div>
          </form>
          <p class="search-engine-status" id="searchEngineStatus" role="status" aria-live="polite"></p>
        </div>

        <div class="col-6 col-lg-6 search-engine-panel">
          <h4 class="search-engine-tree-title" id="searchEngineTreeTitle" data-i18n-text="searchEngineTreeTitle">Árbol de temas</h4>
          <nav class="search-engine-tree" id="searchEngineTree" aria-labelledby="searchEngineTreeTitle"></nav>
        </div>

      </div>

      <div class="line-divider-scarlet"></div>

      <div class="search-engine-contents" id="searchEngineContents">

        <p class="search-engine-placeholder" data-i18n-text="searchEngineInitial">Selecciona un tema del árbol o escribe una búsqueda para ver su información.</p>

      </div>

      <div class="line-divider-scarlet"></div>

      <p data-i18n-text="searchEngineTopicsLabel">Temas:</p>

      <div class="search-engine-topics" id="searchEngineTopics"></div>

    </section>

  </main>

  <footer class="site-footer">
    <a id="ytLink" class="yt-link" href="https://www.youtube.com/@VincentDantesGrey/videos"
       target="_blank" rel="noopener noreferrer">
      <svg class="yt-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="#ff1919" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.3 31.3 0 0 0 0 12a31.3 31.3 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.3 31.3 0 0 0 24 12a31.3 31.3 0 0 0-.5-5.8z"/>
        <path fill="#fff" d="M9.6 15.6 15.8 12 9.6 8.4z"/>
      </svg>
      <span id="ytLabel">YouTube</span>
    </a>
    <p id="copyright" class="copyright"></p>
    <p id="visitCounter" class="visit-counter"></p>
    <div id="langs" class="langs"></div>
  </footer>

  <noscript>UXM – Under Xtreme Madness · Kingdom 277</noscript>
  <script src="../js/i18n.js"></script>
  <script src="../js/i18n/estrategia/i18n.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/strategy-library.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
